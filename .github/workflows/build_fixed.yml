name: Build CoreELEC Xiaomi F9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          set -e
          df -h
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git \
            gperf libncurses5-dev libssl-dev lzop patch python3 \
            rsync unzip wget xz-utils zip

      - name: Clone CoreELEC 22
        run: |
          set -e
          git clone --depth=1 --branch coreelec-22 \
            https://github.com/CoreELEC/CoreELEC.git CoreELEC
          cd CoreELEC
          git log -1 --oneline

      # IMPORTANT: restore AFTER clone.
      # The cache contains files inside CoreELEC, so restoring it before
      # git clone would make the CoreELEC directory non-empty.
      - name: Restore CoreELEC cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/sources
            CoreELEC/build.CoreELEC-Amlogic-no.aarch64-22
            ~/.ccache
          key: coreelec-22-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            coreelec-22-v2-${{ runner.os }}-

      - name: Fix GNU source mirrors
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e
          grep -RIl 'https://ftpmirror.gnu.org/' packages projects 2>/dev/null | while read -r file; do
            echo "Patching: $file"
            sed -i 's#https://ftpmirror.gnu.org/#https://ftp.gnu.org/gnu/#g' "$file"
          done

          GMPPKG="packages/devel/gmp/package.mk"
          if [ -f "$GMPPKG" ]; then
            sed -i \
              's#https://gmplib.org/download/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://ftp.gnu.org/gnu/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#g' \
              "$GMPPKG"
            grep -E 'PKG_(NAME|VERSION|SHA256|URL)=' "$GMPPKG" || true
          else
            echo "ERROR: $GMPPKG not found"
            exit 1
          fi

      - name: Fix m4 source
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e
          M4PKG="$(find packages -path '*m4*' -name 'package.mk' | head -n1)"
          if [ -z "$M4PKG" ]; then
            echo "ERROR: m4 package.mk not found"
            exit 1
          fi

          sed -i \
            's#https://ftpmirror.gnu.org/m4/m4-1.4.21.tar.bz2#https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz#g' \
            "$M4PKG"

          sed -i \
            's#PKG_SHA256="dc487e11d2f0e9c01555bb1af26be4eae983ec8f0726746505b4327186eb21fc"#PKG_SHA256="f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"#' \
            "$M4PKG"

          mkdir -p sources/m4
          M4FILE="sources/m4/m4-1.4.21.tar.xz"
          M4SHA="f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"

          if [ ! -f "$M4FILE" ]; then
            curl -L --retry 8 --retry-delay 3 --connect-timeout 20 --fail \
              -o "$M4FILE" \
              "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz"
          fi

          echo "$M4SHA  $M4FILE" | sha256sum -c -
          grep -E 'PKG_(NAME|VERSION|SHA256|URL)=' "$M4PKG" || true

      - name: Apply Xiaomi first-boot reboot fix
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e
          FS="$(find packages -path '*fs-resize*' -type f -name 'fs-resize' | head -n1 || true)"
          if [ -z "$FS" ]; then
            FS="$(find . -type f -name 'fs-resize' | head -n1 || true)"
          fi
          if [ -z "$FS" ]; then
            echo "ERROR: fs-resize script not found"
            exit 1
          fi

          python3 - "$FS" <<'PY'
          import sys
          from pathlib import Path
          
          p = Path(sys.argv[1])
          s = p.read_text()
          old = "reboot -f"
          
          if old not in s:
              print("ERROR: expected 'reboot -f' was not found")
              print("\n".join(s.splitlines()[-60:]))
              raise SystemExit(1)
          
          new = """sync
          echo "$(date -Iseconds) FSRESIZE: before direct busybox reboot" >> /storage/.config/fs-resize.log
          /usr/bin/busybox reboot -f
          RC=$?
          echo "$(date -Iseconds) FSRESIZE: reboot returned rc=$RC" >> /storage/.config/fs-resize.log
          exit 0"""
          
          pos = s.rfind(old)
          p.write_text(s[:pos] + new + s[pos + len(old):])
          PY

          tail -n 50 "$FS"

      - name: Build CoreELEC image
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e
          ./scripts/build Amlogic-no Generic

      # Save intermediate work even if the build fails.
      # Each run has a new key, while restore-keys selects the newest
      # available cache on the next run.
      - name: Save CoreELEC cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            CoreELEC/sources
            CoreELEC/build.CoreELEC-Amlogic-no.aarch64-22
            ~/.ccache
          key: coreelec-22-v2-${{ runner.os }}-${{ github.run_id }}

      - name: Find build artifacts
        if: always()
        run: |
          find CoreELEC -type f \
            \( -name '*.img.gz' -o -name '*.zip' -o -name '*.tar' \) \
            -printf '%p %s bytes\n' 2>/dev/null | tail -100 || true

      - name: Upload CoreELEC artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Xiaomi-F9
          path: |
            CoreELEC/target/*.img.gz
            CoreELEC/target/*.zip
            CoreELEC/target/*.tar
          if-no-files-found: warn
