 
name: CoreELEC 22 Xiaomi reboot fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      PROJECT: Amlogic-ce
      DEVICE: Amlogic-no
      ARCH: aarch64
      BUILD_PERIODIC: nightly
      SUBDEVICE: Generic
      DTBIMG: s7d_s905x5m_xiaomi_3rd_gen.dtb
      CONCURRENCY_MAKE_LEVEL: 4

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 bc bzip2 curl diffutils gawk \
            gcc g++ gperf gzip file patchutils lzop make patch perl \
            rdfind rsync sed tar unzip xz-utils zip zstd \
            libncurses5-dev libc6-dev libjson-perl libparse-yapp-perl \
            libxml-parser-perl xfonts-utils xsltproc default-jre \
            uuid-runtime pigz qemu-user-binfmt

      - name: Clone CoreELEC 22
        run: |
          git clone --depth=1 --branch coreelec-22 \
            https://github.com/CoreELEC/CoreELEC.git CoreELEC
          cd CoreELEC
          git log -1 --oneline

      - name: Fix GNU source mirrors
        working-directory: CoreELEC
        run: |
          set -e
          echo "=== Fixing GNU source mirrors ==="
          grep -RIl 'https://ftpmirror.gnu.org/' packages projects 2>/dev/null | while read -r file; do
            echo "Patching: $file"
            sed -i 's#https://ftpmirror.gnu.org/#https://ftp.gnu.org/gnu/#g' "$file"
          done
          echo "=== Fixing GMP source ==="
          GMPPKG="packages/devel/gmp/package.mk"
          if [ -f "$GMPPKG" ]; then
            sed -i 's#https://gmplib.org/download/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://ftp.gnu.org/gnu/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#g' "$GMPPKG"
            cat "$GMPPKG"
          else
            echo "ERROR: $GMPPKG not found"
            exit 1
          fi

                    - name: Fix m4 source
                      working-directory: CoreELEC
                      run: |
                       
            echo "Searching m4 package..."
            find packages -path '*m4*' -name 'package.mk' -print

            M4PKG="$(find packages -path '*m4*' -name 'package.mk' | head -n1)"

            if [ -z "$M4PKG" ]; then
              echo "ERROR: m4 package.mk not found"
              exit 1
            fi

            echo "Using: $M4PKG"

            sed -i \
              's#https://ftpmirror.gnu.org/m4/m4-1.4.21.tar.bz2#https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz#g' \
              "$M4PKG"

            echo "Updated m4 package:"
            cat "$M4PKG"

            echo "Testing GNU m4 source..."
            curl -fL --retry 5 --retry-delay 3 \
              -o /tmp/m4-1.4.21.tar.xz \
              https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz

            echo "SHA256:"
            sha256sum /tmp/m4-1.4.21.tar.xz

            echo "Expected:"
            echo "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"

            echo "Verifying checksum..."
            echo "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66  /tmp/m4-1.4.21.tar.xz" \
              | sha256sum -c -

      - name: Apply Xiaomi reboot fix
        working-directory: CoreELEC
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("packages/sysutils/busybox/scripts/fs-resize")
          s = p.read_text()

          old = "reboot -f &>/dev/null\n"

          new = """sync
          LOG=${LOG:-/flash/fs-resize.log}
          echo "$(date -Iseconds) FSRESIZE: before direct busybox reboot" >>$LOG
          sync
          /usr/bin/busybox reboot -f >>$LOG 2>&1
          RC=$?
          echo "$(date -Iseconds) FSRESIZE: reboot returned rc=$RC" >>$LOG
          exit 0
          """

          if s.count(old) != 1:
              raise SystemExit(
                  f"Expected one final reboot line, found {s.count(old)}"
              )

          p.write_text(s.replace(old, new))
          PY

          grep -n -A8 -B3 \
            "direct busybox reboot" \
            packages/sysutils/busybox/scripts/fs-resize

          git diff --check

      - name: Build CoreELEC image
        working-directory: CoreELEC
        run: |
          set -o pipefail
          PROJECT=Amlogic-ce \
          DEVICE=Amlogic-no \
          ARCH=aarch64 \
          BUILD_PERIODIC=nightly \
          SUBDEVICE=Generic \
          DTBIMG=s7d_s905x5m_xiaomi_3rd_gen.dtb \
          CONCURRENCY_MAKE_LEVEL=4 \
          make image 2>&1 | tee ../build.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-22-Xiaomi-reboot-fix-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            CoreELEC/target/*.img.gz
            CoreELEC/target/*.img.gz.sha256
            CoreELEC/target/*.kernel
            CoreELEC/target/*.system
            CoreELEC/packages/sysutils/busybox/scripts/fs-resize
            build.log
