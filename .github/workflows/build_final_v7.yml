name: Build CoreELEC Xiaomi F9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          set -e
          df -h
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git \
            gperf libncurses5-dev libssl-dev lzop patch python3 \
            rsync unzip wget xz-utils zip \
            xfonts-utils rdfind libparse-yapp-perl xsltproc \
            libxml-parser-perl patchutils

      - name: Clone CoreELEC 22
        run: |
          set -e
          git clone --depth=1 --branch coreelec-22 \
            https://github.com/CoreELEC/CoreELEC.git CoreELEC
          cd CoreELEC
          git log -1 --oneline
          echo "CORELEC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Restore only the source cache and ccache from older generations.
      # The build directory is restored only when it matches this exact
      # CoreELEC commit, preventing incompatible build trees.
      - name: Restore CoreELEC source cache
        id: cache-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/sources
            ~/.ccache
          key: coreelec-22-sources-v7-${{ runner.os }}-${{ env.CORELEC_SHA }}
          restore-keys: |
            coreelec-22-sources-v7-${{ runner.os }}-
            coreelec-22-sources-v6-${{ runner.os }}-
            coreelec-22-sources-v5-${{ runner.os }}-

      - name: Restore exact CoreELEC build cache
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: CoreELEC/build.CoreELEC-Amlogic-no.aarch64-22
          key: coreelec-22-build-v7-${{ runner.os }}-${{ env.CORELEC_SHA }}

      - name: Fix GNU source mirrors
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e

          # Redirect only the unavailable GNU mirror hostname.
          # Do this safely even when there are no matches.
          while IFS= read -r -d '' file; do
            echo "Patching GNU mirror: $file"
            sed -i \
              -e 's#https://ftpmirror.gnu.org/gnu/#https://ftp.gnu.org/gnu/#g' \
              -e 's#https://ftpmirror.gnu.org/#https://ftp.gnu.org/gnu/#g' \
              "$file"
          done < <(
            grep -RIlZ 'https://ftpmirror.gnu.org/' packages projects 2>/dev/null || true
          )

          # Remove an accidental duplicate path if an older cached package
          # file or previous workflow produced it.
          while IFS= read -r -d '' file; do
            echo "Normalizing duplicate GNU path: $file"
            sed -i 's#https://ftp.gnu.org/gnu/gnu/#https://ftp.gnu.org/gnu/#g' "$file"
          done < <(
            grep -RIlZ 'https://ftp.gnu.org/gnu/gnu/' packages projects 2>/dev/null || true
          )

          GMPPKG="packages/devel/gmp/package.mk"
          test -f "$GMPPKG"

          sed -i \
            's#^PKG_URL=.*#PKG_URL="https://ftp.gnu.org/gnu/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz"#' \
            "$GMPPKG"

          echo "GMP:"
          grep -E '^PKG_(NAME|VERSION|SHA256|URL)=' "$GMPPKG"

      - name: Fix m4 source
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e

          M4PKG="$(find packages -path '*m4*' -name 'package.mk' | head -n1)"
          test -n "$M4PKG"

          sed -i \
            's#^PKG_URL=.*#PKG_URL="https://ftp.gnu.org/gnu/m4/${PKG_NAME}-${PKG_VERSION}.tar.xz"#' \
            "$M4PKG"

          sed -i \
            's#^PKG_SHA256=.*#PKG_SHA256="f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"#' \
            "$M4PKG"

          mkdir -p sources/m4
          M4FILE="sources/m4/m4-1.4.21.tar.xz"
          M4SHA="f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"

          if [ ! -f "$M4FILE" ]; then
            curl -L --retry 8 --retry-delay 3 --connect-timeout 20 --fail \
              -o "$M4FILE" \
              "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz"
          fi

          echo "$M4SHA  $M4FILE" | sha256sum -c -

          echo "m4:"
          grep -E '^PKG_(NAME|VERSION|SHA256|URL)=' "$M4PKG"

      - name: Fix GCC source
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e

          GCCPKG="packages/lang/gcc/package.mk"
          test -f "$GCCPKG"

          GCCFILE="sources/gcc/gcc-16.2.0.tar.xz"
          GCCURL="https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
          GCCSHA="e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"

          sed -i \
            's#^PKG_URL=.*#PKG_URL="https://ftp.gnu.org/gnu/gcc/${PKG_NAME}-${PKG_VERSION}/${PKG_NAME}-${PKG_VERSION}.tar.xz"#' \
            "$GCCPKG"

          sed -i \
            's#^PKG_SHA256=.*#PKG_SHA256="e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"#' \
            "$GCCPKG"

          mkdir -p sources/gcc

          if [ ! -f "$GCCFILE" ]; then
            curl -L --retry 8 --retry-delay 3 --connect-timeout 20 --fail \
              -o "$GCCFILE" "$GCCURL"
          fi

          echo "$GCCSHA  $GCCFILE" | sha256sum -c -

          echo "GCC:"
          grep -E '^PKG_(NAME|VERSION|SHA256|URL)=' "$GCCPKG"

      - name: Verify host dependencies
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e
          for cmd in mkfontdir mkfontscale rdfind xsltproc bdftopcf lsdiff; do
            command -v "$cmd"
          done
          perl -MParse::Yapp::Driver -e 'print "Parse::Yapp::Driver OK\n"'
          perl -MXML::Parser -e 'print "XML::Parser OK\n"'
          echo "All host dependencies: OK"

      - name: Apply Xiaomi first-boot reboot fix
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e

          FS="$(find packages -path '*fs-resize*' -type f -name 'fs-resize' | head -n1 || true)"
          if [ -z "$FS" ]; then
            FS="$(find . -type f -name 'fs-resize' | head -n1 || true)"
          fi
          test -n "$FS"

          python3 - "$FS" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          old = "reboot -f"
          if old not in s:
              print("ERROR: expected 'reboot -f' not found")
              print("\n".join(s.splitlines()[-60:]))
              raise SystemExit(1)

          new = """sync
          echo "$(date -Iseconds) FSRESIZE: before direct busybox reboot" >> /storage/.config/fs-resize.log
          /usr/bin/busybox reboot -f
          RC=$?
          echo "$(date -Iseconds) FSRESIZE: reboot returned rc=$RC" >> /storage/.config/fs-resize.log
          exit 0"""

          pos = s.rfind(old)
          p.write_text(s[:pos] + new + s[pos + len(old):])
          PY

          grep -n -A8 -B4 "busybox reboot" "$FS"

      - name: Build CoreELEC image
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e
          PROJECT=Amlogic-ce \
          DEVICE=Amlogic-no \
          ARCH=aarch64 \
          make image

      # Always save source/cache work. Build cache is commit-specific.
      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            CoreELEC/sources
            ~/.ccache
          key: coreelec-22-sources-v7-${{ runner.os }}-${{ env.CORELEC_SHA }}

      - name: Save exact build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: CoreELEC/build.CoreELEC-Amlogic-no.aarch64-22
          key: coreelec-22-build-v7-${{ runner.os }}-${{ env.CORELEC_SHA }}

      - name: Find build artifacts
        if: always()
        run: |
          echo "=== CoreELEC artifacts ==="
          find CoreELEC/target -maxdepth 2 -type f \
            \( -name '*.img.gz' -o -name '*.zip' -o -name '*.tar' \) \
            -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload CoreELEC artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Xiaomi-F9
          path: |
            CoreELEC/target/*.img.gz
            CoreELEC/target/*.zip
            CoreELEC/target/*.tar
          if-no-files-found: warn
