name: Build CoreELEC Xiaomi F9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git \
            gperf libncurses5-dev libssl-dev lzop patch python3 \
            rsync unzip wget xz-utils zip

      - name: Restore CoreELEC cache
        uses: actions/cache@v4
        with:
          path: |
            CoreELEC/sources
            CoreELEC/build.*
            ~/.ccache
          key: coreelec-22-${{ runner.os }}-${{ hashFiles('**/build.yml') }}
          restore-keys: |
            coreelec-22-${{ runner.os }}-

      - name: Clone CoreELEC 22
        run: |
          git clone --depth=1 --branch coreelec-22 \
            https://github.com/CoreELEC/CoreELEC.git CoreELEC
          cd CoreELEC
          git log -1 --oneline

      - name: Fix GNU source mirrors
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e
          echo "=== Fixing GNU source mirrors ==="

          grep -RIl 'https://ftpmirror.gnu.org/' packages projects 2>/dev/null | while read -r file; do
            echo "Patching: $file"
            sed -i 's#https://ftpmirror.gnu.org/#https://ftp.gnu.org/gnu/#g' "$file"
          done

          echo "=== Fixing GMP source ==="
          GMPPKG="packages/devel/gmp/package.mk"

          if [ -f "$GMPPKG" ]; then
            sed -i \
              's#https://gmplib.org/download/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://ftp.gnu.org/gnu/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#g' \
              "$GMPPKG"
            grep -E 'PKG_(NAME|VERSION|SHA256|URL)=' "$GMPPKG" || true
          else
            echo "ERROR: $GMPPKG not found"
            exit 1
          fi

      - name: Fix m4 source
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e

          M4PKG="$(find packages -path '*m4*' -name 'package.mk' | head -n1)"

          if [ -z "$M4PKG" ]; then
            echo "ERROR: m4 package.mk not found"
            exit 1
          fi

          echo "Using m4 package: $M4PKG"

          # Keep the original .tar.bz2 format and checksum used by CoreELEC.
          sed -i \
            's#https://ftpmirror.gnu.org/m4/m4-1.4.21.tar.bz2#https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.bz2#g' \
            "$M4PKG"

          mkdir -p sources/m4

          M4FILE="sources/m4/m4-1.4.21.tar.bz2"
          M4SHA="dc487e11d2f0e9c01555bb1af26be4eae983ec8f0726746505b4327186eb21fc"

          if [ ! -f "$M4FILE" ]; then
            echo "Downloading official GNU m4 source..."
            curl -L --retry 5 --retry-delay 3 --fail \
              -o "$M4FILE" \
              "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.bz2"
          fi

          echo "$M4SHA  $M4FILE" | sha256sum -c -

          grep -E 'PKG_(NAME|VERSION|SHA256|URL)=' "$M4PKG" || true

      - name: Apply Xiaomi first-boot reboot fix
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e

          PATCH_FILE="$GITHUB_WORKSPACE/fs-resize-direct-reboot.patch"

          cat > "$PATCH_FILE" <<'PATCH'
--- packages/sysutils/fs-resize/scripts/fs-resize.orig
+++ packages/sysutils/fs-resize/scripts/fs-resize
@@ -1,3 +1,3 @@
-PATCH_PLACEHOLDER
+PATCH_PLACEHOLDER
 PATCH

          # Locate the actual fs-resize script.
          FS="$(find packages -path '*fs-resize*' -type f -name 'fs-resize' | head -n1 || true)"

          if [ -z "$FS" ]; then
            FS="$(find . -type f -name 'fs-resize' | head -n1 || true)"
          fi

          if [ -z "$FS" ]; then
            echo "ERROR: fs-resize script not found"
            exit 1
          fi

          echo "fs-resize: $FS"

          # Replace only the final systemd reboot with direct BusyBox reboot.
          python3 - "$FS" <<'PY'
import sys
from pathlib import Path

p = Path(sys.argv[1])
s = p.read_text()

old = """reboot -f"""
new = """sync
echo "$(date -Iseconds) FSRESIZE: before direct busybox reboot" >> /storage/.config/fs-resize.log
/usr/bin/busybox reboot -f
RC=$?
echo "$(date -Iseconds) FSRESIZE: reboot returned rc=$RC" >> /storage/.config/fs-resize.log
exit 0"""

if old not in s:
    print("WARNING: 'reboot -f' not found; showing tail of script:")
    print("\n".join(s.splitlines()[-40:]))
    raise SystemExit(1)

# Replace the final occurrence only.
pos = s.rfind(old)
s = s[:pos] + new + s[pos+len(old):]
p.write_text(s)
PY

          tail -n 50 "$FS"

      - name: Build CoreELEC image
        working-directory: CoreELEC
        shell: bash
        run: |
          set -e
          PROJECT="Amlogic-no"
          DEVICE="Generic"
          ./scripts/build "$PROJECT" "$DEVICE"

      - name: Find build artifacts
        if: always()
        run: |
          find CoreELEC -type f \
            \( -name '*.img.gz' -o -name '*.zip' -o -name '*.tar' \) \
            -printf '%p %s bytes\n' 2>/dev/null | tail -100

      - name: Upload CoreELEC artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-Xiaomi-F9
          path: |
            CoreELEC/target/*.img.gz
            CoreELEC/target/*.zip
            CoreELEC/target/*.tar
          if-no-files-found: warn
